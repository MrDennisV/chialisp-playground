# ChiaLisp playground: one nginx serving the static site.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# In production, stack the edge overlay on top — it drops the host port and the
# shared Caddy edge (chia-gaming-edge) routes chialisp.mrdennis.dev to nginx:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.edge.yml up -d
name: chialisp-playground

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: chialisp-playground:latest
    ports:
      - '${PUBLIC_PORT:-8082}:80'
    restart: unless-stopped
